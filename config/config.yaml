# SDS Configuration - Streamlit Cloud optimised

video:
  source: 0
  fps: 30
  resize_width: 1280
  resize_height: 720

detection:
  model: "yolov8n.pt"        # nano - committed to repo
  confidence: 0.3
  iou_threshold: 0.45
  classes: [0]               # 0 = person in COCO
  device: "cpu"              # Streamlit Cloud has no GPU
  imgsz: 640
  augment: false             # disable TTA on cloud (too slow on CPU)
  max_det: 300
  tta_scales: [1.0]
  flip_tta: false
  nms_iou: 0.55

tracking:
  max_age: 30
  n_init: 3
  max_iou_distance: 0.7
  max_cosine_distance: 0.3
  nn_budget: 100
  use_appearance: false      # disable mobilenet embedder - no GPU on cloud

density:
  enabled: true
  grid_size: [8, 6]
  thresholds:
    low: 5
    medium: 15
    high: 30
    critical: 50
  heatmap_alpha: 0.4

flow:
  enabled: true
  method: "farneback"
  flow_interval: 5
  vector_scale: 3
  min_flow_magnitude: 2.0
  arrow_density: 20

threats:
  enabled: true
  panic:
    speed_threshold: 5.0
    density_spike: 2.0
  stampede:
    opposing_flow_angle: 135
    high_density_threshold: 40
  unattended_object:
    stationary_time: 30
    size_threshold: [50, 50]
  collapse:
    motionless_time: 10
    on_ground_aspect_ratio: 2.5
  restricted_zones: []

visualization:
  show_bboxes: true
  show_ids: false
  show_density_heatmap: true
  show_flow_arrows: true
  show_threats: true
  show_display: true
  font_scale: 0.45
  line_thickness: 1

output:
  save_video: false
  output_dir: "results"
  show_fps: true
  log_events: true
