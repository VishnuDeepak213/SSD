name: Keep Surveillance App Awake

on:
  schedule:
    # Runs every 10 hours to beat the 12-hour sleep timer
    - cron: '0 */10 * * *'
  workflow_dispatch: # Allows manual triggers from GitHub Actions tab

jobs:
  ping_repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Push Empty Commit
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          git commit --allow-empty -m "Automated keep-alive ping for Smart Detection app"
          git push origin main
